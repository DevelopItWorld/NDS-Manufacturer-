<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDS Manufacturer - Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <!-- Background Elements -->
        <div class="auth-bg"></div>
        <div class="auth-gradient"></div>

        <!-- Main Auth Box -->
        <div class="auth-box">
            <!-- Login Form -->
            <div class="auth-form login-form active" id="loginForm">
                <div class="auth-header">
                    <div class="auth-logo">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h1>Welcome Back</h1>
                    <p>Sign in to NDS Manufacturer</p>
                </div>

                <form id="loginFormElement" class="form">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input 
                                type="email" 
                                id="loginEmail" 
                                placeholder="Enter your email" 
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input 
                                type="password" 
                                id="loginPassword" 
                                placeholder="Enter your password" 
                                required
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="remember-forgot">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="auth-btn">Sign In</button>
                </form>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <div class="social-login">
                    <button class="social-btn google-btn">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button class="social-btn github-btn">
                        <i class="fab fa-github"></i> GitHub
                    </button>
                </div>

                <p class="auth-footer">
                    Don't have an account? 
                    <a href="#" onclick="toggleForms(event)">Sign Up</a>
                </p>
            </div>

            <!-- Signup Form -->
            <div class="auth-form signup-form" id="signupForm">
                <div class="auth-header">
                    <div class="auth-logo">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h1>Create Account</h1>
                    <p>Join NDS Manufacturer today</p>
                </div>

                <form id="signupFormElement" class="form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="signupFirstName">First Name</label>
                            <div class="input-wrapper">
                                <i class="fas fa-user"></i>
                                <input 
                                    type="text" 
                                    id="signupFirstName" 
                                    placeholder="First name" 
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="signupLastName">Last Name</label>
                            <div class="input-wrapper">
                                <i class="fas fa-user"></i>
                                <input 
                                    type="text" 
                                    id="signupLastName" 
                                    placeholder="Last name" 
                                    required
                                >
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input 
                                type="email" 
                                id="signupEmail" 
                                placeholder="Enter your email" 
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupCompany">Company (Optional)</label>
                        <div class="input-wrapper">
                            <i class="fas fa-building"></i>
                            <input 
                                type="text" 
                                id="signupCompany" 
                                placeholder="Company name"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input 
                                type="password" 
                                id="signupPassword" 
                                placeholder="Create a password" 
                                required
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('signupPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupConfirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input 
                                type="password" 
                                id="signupConfirmPassword" 
                                placeholder="Confirm password" 
                                required
                            >
                            <button type="button" class="password-toggle" onclick="togglePassword('signupConfirmPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <label class="checkbox-label terms">
                        <input type="checkbox" id="agreeTerms" required>
                        <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
                    </label>

                    <button type="submit" class="auth-btn">Create Account</button>
                </form>

                <p class="auth-footer">
                    Already have an account? 
                    <a href="#" onclick="toggleForms(event)">Sign In</a>
                </p>
            </div>
        </div>

        <!-- Floating Elements (Decorative) -->
        <div class="float-element element-1"></div>
        <div class="float-element element-2"></div>
        <div class="float-element element-3"></div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="auth.js"></script>
</body>
</html>
